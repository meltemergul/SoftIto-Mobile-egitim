<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Video Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                "Segoe UI", Tahoma, "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: gray;
            color: black;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .player-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            border-radius: 12px;
            overflow: hidden;
            background: black;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        video {
            width: 100%;
            display: block;
        }

        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.5));
            display: flex;
            justify-content: space-between;
            padding: 12px;
            flex-direction: column;
            transition: opacity 0.3s ease;
        }

        .timeline-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-variant: tabular-nums;
        }

        .progress-bar {
            flex: 1;
            -webkit-appearance: none;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            cursor: pointer;
            position: relative;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .left-controls,
        .right-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        button {
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .speed-badge {
            background: #0284c7;
            color: white;
        }
    </style>
</head>

<body>
    <h2 style="margin-bottom: 16px">HTML5 Video Player</h2>
    <div class="player-container" id="videoBox">
        <video id="myVideo" playsinline webkit-playsinline preload="metadata">
            <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4" />
            <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm" type="video/webm" />
            Your browser does not support the video
        </video>
        <div class="custom-controls" id="controls">
            <!--ilerleme çubuğu ve süre-->
            <div class="timeline-container">
                <span id="currentTime">0:00</span>
                <input type="range" class="progress-bar" id="progressBar" value="0" min="0" max="100" />
                <span id="durationTime">0:00</span>
            </div>
            <div class="button-group">
                <div class="left-controls">
                    <button id="btnPlay">Oynat</button>
                    <button id="btnMute">Sesli</button>
                </div>
                <div class="right-controls">
                    <button id="btnSpeed" class="speed-badge">1.0x</button>
                    <button id="btnPip">Pip</button>
                    <button id="btnFull">Tam Ekran</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById("myVideo");
        const btnPlay = document.getElementById("btnPlay");
        const btnMute = document.getElementById("btnMute");
        const btnSpeed = document.getElementById("btnSpeed");
        const btnPip = document.getElementById("btnPip");
        const btnFull = document.getElementById("btnFull");
        const progressBar = document.getElementById("progressBar");
        const currentTimeEL = document.getElementById("currentTime");
        const durationTimeEL = document.getElementById("durationTime");

        let isPlaying = false;
        let isMuted = false;
        let playbackRate = 1.0;

        // 1.Play/Pause Yönetimi
        btnPlay.addEventListener("click", () => {
            if (video.paused) {
                video.play();
                btnPlay.textContent = "Duraklat";
            } else {
                video.pause();
                btnPlay.textContent = "Oynat";
            }
        });


        //2.Zaman Formatlama
        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }

        //3.Metadata Toplam Süreyi Alma
        video.addEventListener("loadedmetadata", () => {
            durationTimeEL.innerText = formatTime(video.duration);
        });

        //4.Video Oynarken ilerleme çubuğunu güncelleme
        video.addEventListener("timeupdate", () => {
            currentTimeEL.innerText = formatTime(video.currentTime);
            const progress = (video.currentTime / video.duration) * 100;
            progressBar.value = isNaN(progress) ? 0 : progress;
        });

        //5.Kullanıcı çubuğu kaycırdığında videoyu ileri geri sarma
        progressBar.addEventListener("input", (e) => {
            const seekTime = (e.target.value / 100) * video.duration;
            video.currentTime = seekTime;
        });

        //6.Sessize alma toggle
        btnMute.addEventListener("click", () => {
            video.muted = !video.muted;
            btnMute.textContent = video.muted ? "Sessiz" : "Sesli";
        });


        //7.Oynatma Hızı
        const speeds = [1.0, 1.25, 1.5, 2.0];
        let speedIndex = 0;
        btnSpeed.addEventListener("click", () => {
            speedIndex = (speedIndex + 1) % speeds.length;
            video.playbackRate = speeds[speedIndex];
            btnSpeed.innerText = `${speeds[speedIndex]}x`;
        });

        //8.PiP resim içinde resim
        btnPip.addEventListener("click", async () => {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    await video.requestPictureInPicture();
                }
            } catch (error) {
                console.warn("PiP desteklenmiyor veya izin vermiyor:", error);
            }
        });

        //9.Tam Ekran
        btnFull.addEventListener("click", async () => {
          const container = document.getElementById("videoBox");
          if (!document.fullscreenElement) {
            await container.requestFullscreen().catch((err) => alert(`Tam ekran moduna geçilemedi: ${err.message}`));
              } else {
            await document.exitFullscreen();
          }         
        }); 

    
    </script>
</body>

</html>
