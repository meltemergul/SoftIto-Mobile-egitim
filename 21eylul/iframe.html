<!DOCTYPE html>
<html lang="en">

<head>

    <title>Iframe </title>
    <style>
        body {
            font-family: 'Courer New', Courier, monospace;
            margin: auto;
            padding: 20px;
            max-width: 600px;
            background: khaki;
        }

        .card {
            background-color: blueviolet;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            border: 1px solid #e2e8f0;
            margin-bottom: 52px;

        }

        h3 {
            margin-top: 0;
            color: #1e293b;
        }

        iframe {
            width: 100%;
            border: none;
            border-radius: 8px;

        }
    </style>
</head>
