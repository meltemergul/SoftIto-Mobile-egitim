<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline-First Taslak & Sepet Depolama</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: auto;
            box-shadow: 0;
            padding: 24px;
            max-width: 520px;
            background: #f8fafc;
        }

        .card {
            background-color: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;

        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1.5px solid #cbd5c1;
            font-size: 14px;
            box-sizing: border-box;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            color: #0369a1;
            background: #e0f2fe;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-submit {
            background-color: darkgreen;
            color: white;
        }

        .btn-clear {
            background-color: darkred;
            color: white;
        }

        .status-msg {
            margin-top: 8px;
            font-size: 12px;
            color: #10b981;
            font-weight: 600;
            min-height: 18px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="badge"> Otomatik Offline Kayıt Aktif</div>
        <h3>Müşteri Arıza & Destek Kayıt Formu</h3>
        <p style="font-size: 12px; color: #64748b; margin-bottom: 16px;">
            Tarayıcıyı kapatsanız bile bunlar kayıt olarak kalacaktır.
        </p>
        <form id="supportForm">
            <div class="form-group">
                <label for="txtName">Müşteri Ad Soyad:</label>
                <input type="text" id="txtName" name="name" placeholder="Ad Soyad" required>
            </div>
            <div class="form-group">
                <label for="txtDevice">Cihaz Modeli & Seri No:</label>
                <input type="text" id="txtDevice" name="device" placeholder="Cihaz Modeli & Seri No" required>
            </div>
            <div class="form-group">
                <label for="txtDesc">Arıza Detayı:</label>
                <textarea id="txtDesc" name="desc" rows="4" required placeholder="Arıza detayını girin"></textarea>
            </div>
            <div class="status-msg" id="statusMsg"></div>

            <div class="btn-group">
                <button type="submit" class="btn-submit">Kaydı Tamamla</button>
                <button type="button" class="btn-clear" id="clearBtn">Taslağı Sıfırla</button>
            </div>
        </form>

        <script>
            const STORAGE_KEY = 'meltem_support_softito';
            const form = document.getElementById('supportForm');
            const nameInput = document.getElementById('txtName');
            const deviceInput = document.getElementById('txtDevice');
            const descInput = document.getElementById('txtDesc');
            const statusLog = document.getElementById('statusLog');
            const btnClear = document.getElementById('clearBtn');

            //1.sayfa açıldığında localStorage'dan verileri yükle
            window.addEventListener('DOMContentLoaded', () => {
                const savedData = localStorage.getItem(STORAGE_KEY);
                if (savedData) {
                    try {
                        const draft = JSON.parse(savedData);
                        nameInput.value = draft.name || '';
                        deviceInput.value = draft.device || '';
                        descInput.value = draft.desc || '';
                        statusMsg.innerText = `Önceki Taslak  geri yüklendi. (${draft.lastSaved})`;
                    } catch (error) {
                        console.error('Taslak parse hatası  ', error);
                    }

                }
            })

            ///2.formdaki her bir girişi JSON olarak localStorage'a kaydet
            form.addEventListener('input', () => {
                const draftData = {
                    name: nameInput.value,
                    device: deviceInput.value,
                    desc: descInput.value,
                    lastSaved: new Date().toLocaleString('tr-TR')
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(draftData));
                statusLog.innerText = `Taslak Otomatik olarak kaydedildi. (${draftData.lastSaved})`;
            });


            //3.form submit edildiğinde localStorage'dan verileri sil
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                alert('Destek talebiniz başarıyla merkeze iletildi');
                localStorage.removeItem(STORAGE_KEY);
                form.reset();
                statusLog.innerText = 'Kayıt tamamlandı ve taslak silindi.';

            });

            //4.taslağı manuel olarak temizleme
            btnClear.addEventListener('click', () => {
                if (confirm('Taslağı silmek istediğinize emin misiniz?')) {
                    localStorage.removeItem(STORAGE_KEY);
                    form.reset();
                    statusLog.innerText = 'Taslak manuel olarak silindi.';
                }
            });


            //5.çoklu seçme sihirli senkroizasyon
            // Eğer birden fazla sekme açıksa, bir sekmede yapılan değişiklik diğer sekmeye otomatik olarak yansıyacak
            window.addEventListener('storage', (event) => {
                if (event.key === STORAGE_KEY && event.newValue) {
                    const remoteDraft = JSON.parse(event.newValue);
                    nameInput.value = remoteDraft.name || '';
                    deviceInput.value = remoteDraft.device || '';
                    descInput.value = remoteDraft.desc || '';
                    statusLog.innerText = `Diğer sekmeden güncellendi. (${remoteDraft.lastSaved})`;

                }
            });



        </script>
    </div>
</body>

</html>
