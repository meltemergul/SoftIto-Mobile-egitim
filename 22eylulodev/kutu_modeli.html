<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model & Taşma Koruması</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .box-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #475569;
        }

        /* content-box taşma örneği (Eğitim amaçlı tutulmuştur) */
        .broken-box {
            box-sizing: content-box;
            width: 100%;
            padding: 24px;
            border: 6px solid #ef4444;
            background-color: #fee2e2;
            border-radius: 12px;
            color: #991b1b;
            font-weight: 600;
        }

        /* Standarda uygun border-box */
        .fixed-box {
            width: 100%;
            padding: 24px;
            border: 6px solid #10b981;
            background-color: #d1fae5;
            border-radius: 12px;
            color: #065f46;
            font-weight: 600;
        }

        /* Metin taşmasını engelleme (Sınırlandırılmış ve Duyarlı) */
        .truncate-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            /* Sabit px yerine kapsayıcısına %100 uyum sağlar */
            background: white;
            padding: 10px 12px;
            border-radius: 8px;
            margin-top: 14px;
            border: 1px solid #a7f3d0;
            color: #334155;
            font-weight: normal;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="box-container">
        <div>
            <h3 class="section-title">content-box (Taşma Yapan Eleman)</h3>
            <div class="broken-box">Ekrandan dışarı taşan kutu</div>
        </div>

        <div>
            <h3 class="section-title">border-box (Kusursuz Kutumuz)</h3>
            <div class="fixed-box">
                Tam ekran sınırında kalan mobil dostu kutumuz
                <div class="truncate-text"
                    title="TR45 0006 1005 0000 9210 0000 00 - Bu çok uzun bir IBAN veya sipariş kodu olabilir">
                    Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the
                    industry's standard dummy text ever since 1500s.
                </div>
            </div>
        </div>
    </div>
</body>

</html>
