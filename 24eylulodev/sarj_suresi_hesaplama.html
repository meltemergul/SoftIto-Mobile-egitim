<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şarj Süresi Hesaplama</title>
</head>

<body>


    <script>
        /*1.Şarj Süresi Hesaplama */
        const sarjSuresi = (
            mevcutYuzde,
            hedefYuzde,
            bataryaKapasitesiKwh,
            istasyonKw,
            aracMaksKw,
            verimlilik = 0.90
        ) => {
            if (mevcutYuzde >= hedefYuzde) return 0;
            if (mevcutYuzde < 0 || hedefYuzde > 100) return 0;

            const sarjYuzdesi = hedefYuzde - mevcutYuzde;
            const gerekliEnerji = bataryaKapasitesiKwh * (sarjYuzdesi / 100);

            const gercekSarjGucu = Math.min(istasyonKw, aracMaksKw);

            if (gercekSarjGucu <= 0) return 0;

            // Verimlilik kaybını da dikkate alarak süreyi dakika cinsinden hesapla
            const sureSaat = (gerekliEnerji / (gercekSarjGucu * verimlilik));
            return Math.round(sureSaat * 60);
        };

        // Örnek: 60 kWh batarya, %20'den %80'e, 100 kW İstasyon, Araç maks 75 kW destekliyor
        console.log(sarjSuresi(20, 80, 60, 100, 75)); // Tahmini ~32 dakika


        /*2.Şarj Süresi ve Fiyat Hesabı*/
        const sarjHesapla = (
            mevcutYuzde,
            hedefYuzde,
            bataryaKapasitesiKwh,
            istasyonKw,
            aracMaksKw,
            kwhFiyati = 9.5,
            sabitUcret = 20,
            verimlilik = 0.90
        ) => {
            // Geçersiz girdi kontrolleri
            if (mevcutYuzde >= hedefYuzde || mevcutYuzde < 0 || hedefYuzde > 100) {
                return { sureDakika: 0, cekilenKwh: 0, toplamTutar: 0 };
            }

            const sarjYuzdesi = hedefYuzde - mevcutYuzde;
            // Bataryaya girmesi gereken net enerji
            const netEnerji = bataryaKapasitesiKwh * (sarjYuzdesi / 100);

            // Kayıplar dahil prizden/şebekeden çekilen brüt enerji
            const brutEnerji = netEnerji / verimlilik;

            // Gerçekleşen şarj hızı
            const gercekSarjGucu = Math.min(istasyonKw, aracMaksKw);
            if (gercekSarjGucu <= 0) return { sureDakika: 0, cekilenKwh: 0, toplamTutar: 0 };

            // Süre hesabı (dakika)
            const sureDakika = Math.round((netEnerji / (gercekSarjGucu * verimlilik)) * 60);

            // Maliyet hesabı: (Çekilen kWh * Birim Fiyat) + Sabit Ücret
            const enerjiTutari = brutEnerji * kwhFiyati;
            const toplamTutar = enerjiTutari + sabitUcret;

            return {
                sureDakika: sureDakika,
                cekilenKwh: Number(brutEnerji.toFixed(2)),
                toplamTutar: Number(toplamTutar.toFixed(2))
            };
        };

        // %20'den %80'e, 60 kWh batarya, 100 kW istasyon, araç maks 75 kW destekliyor
        // kWh Fiyatı: 9.5 TL, Sabit Ücret: 20 TL
        const sonuc2 = sarjHesapla(20, 80, 60, 100, 75, 9.5, 20);

        console.log(sonuc2);
        // Çıktı: { sureDakika: 32, cekilenKwh: 40, toplamTutar: 400 }


        /* 3.Şarj Süresi ,Fiyat,Gece-Gündüz Tarifesi*/
        const TarifeliSarjHesapla = (
            mevcutYuzde,
            hedefYuzde,
            bataryaKapasitesiKwh,
            istasyonKw,
            aracMaksKw,
            baslangicSaati = 20,  // Şarjın başladığı saat (0-23 arası tam sayı)
            gunduzKwhFiyati = 9.5, // 06:00 - 22:00 arası (TL/kWh)
            geceKwhFiyati = 6.0,   // 22:00 - 06:00 arası (TL/kWh)
            sabitUcret = 20,       // Soket açılış ücreti (TL)
            verimlilik = 0.90      // %90 verimlilik
        ) => {
            if (mevcutYuzde >= hedefYuzde || mevcutYuzde < 0 || hedefYuzde > 100) {
                return { sureDakika: 0, cekilenKwh: 0, toplamTutar: 0, detay: { gunduzKwh: 0, geceKwh: 0 } };
            }

            const sarjYuzdesi = hedefYuzde - mevcutYuzde;
            const netEnerji = bataryaKapasitesiKwh * (sarjYuzdesi / 100);
            const brutEnerji = netEnerji / verimlilik;

            const gercekSarjGucu = Math.min(istasyonKw, aracMaksKw);
            if (gercekSarjGucu <= 0) return { sureDakika: 0, cekilenKwh: 0, toplamTutar: 0, detay: { gunduzKwh: 0, geceKwh: 0 } };

            // Toplam şarj süresi (Saat cinsinden)
            const toplamSureSaat = brutEnerji / gercekSarjGucu;
            const sureDakika = Math.round(toplamSureSaat * 60);

            // Gece / Gündüz saat dağılımını hesaplama (Saat saat hesaplanır)
            let gunduzSaatleri = 0;
            let geceSaatleri = 0;
            let kalanSure = toplamSureSaat;
            let mevcutSaat = baslangicSaati % 24;

            while (kalanSure > 0) {
                const harcananSüre = Math.min(kalanSure, 1); // En fazla 1 saatlik dilim al

                // 06:00 - 22:00 arası Gündüz tarifesidir
                if (mevcutSaat >= 6 && mevcutSaat < 22) {
                    gunduzSaatleri += harcananSüre;
                } else {
                    geceSaatleri += harcananSüre;
                }

                kalanSure -= harcananSüre;
                mevcutSaat = (mevcutSaat + 1) % 24;
            }

            // Çekilen toplam enerjiyi geçen sürelere oranla gündüz/geceye dağıt
            const gunduzKwh = (gunduzSaatleri / toplamSureSaat) * brutEnerji;
            const geceKwh = (geceSaatleri / toplamSureSaat) * brutEnerji;

            // Tutar hesabı
            const gunduzTutar = gunduzKwh * gunduzKwhFiyati;
            const geceTutar = geceKwh * geceKwhFiyati;
            const toplamTutar = gunduzTutar + geceTutar + sabitUcret;

            return {
                sureDakika: sureDakika,
                cekilenKwh: Number(brutEnerji.toFixed(2)),
                toplamTutar: Number(toplamTutar.toFixed(2)),
                detay: {
                    gunduzKwh: Number(gunduzKwh.toFixed(2)),
                    geceKwh: Number(geceKwh.toFixed(2)),
                    gunduzTutar: Number(gunduzTutar.toFixed(2)),
                    geceTutar: Number(geceTutar.toFixed(2))
                }
            };
        };

        // Örnek: Saat 21:00'de başlayan ve geceye sarkan şarj işlemi (Yaklaşık 2 saat / 120 dk sürsün)
        // %10'dan %90'a, 100 kWh batarya, 40 kW şarj hızı
        const sonuc3 = TarifeliSarjHesapla(
            10,   // Mevcut %
            90,   // Hedef %
            100,  // Batarya kWh
            40,   // İstasyon kW
            50,   // Araç Maks kW
            21,   // Başlangıç saati (21:00)
            9.5,  // Gündüz kWh Fiyatı
            6.0,  // Gece kWh Fiyatı
            20    // Sabit Ücret
        );

        console.log(sonuc3);

        /*
        Çıktı Örneği:
        {
          sureDakika: 133,
          cekilenKwh: 88.89,
          toplamTutar: 712.96,
          detay: {
            gunduzKwh: 39.88,  (21:00 - 22:00 arası gündüzden yazdı)
            geceKwh: 49.01,    (22:00'den sonrası geceden yazdı)
            gunduzTutar: 378.86,
            geceTutar: 294.09
          }
        }
        */
    </script>
