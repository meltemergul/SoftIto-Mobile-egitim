<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şarj Süresi Hesaplama</title>
</head>

<body>


    <script>
        /*1.Şarj Süresi Hesaplama */
        const sarjSuresi = (
            mevcutYuzde,
            hedefYuzde,
            bataryaKapasitesiKwh,
            istasyonKw,
            aracMaksKw,
            verimlilik = 0.90
        ) => {
            if (mevcutYuzde >= hedefYuzde) return 0;
            if (mevcutYuzde < 0 || hedefYuzde > 100) return 0;

            const sarjYuzdesi = hedefYuzde - mevcutYuzde;
            const gerekliEnerji = bataryaKapasitesiKwh * (sarjYuzdesi / 100);

            const gercekSarjGucu = Math.min(istasyonKw, aracMaksKw);

            if (gercekSarjGucu <= 0) return 0;

            // Verimlilik kaybını da dikkate alarak süreyi dakika cinsinden hesapla
            const sureSaat = (gerekliEnerji / (gercekSarjGucu * verimlilik));
            return Math.round(sureSaat * 60);
        };

        // Örnek: 60 kWh batarya, %20'den %80'e, 100 kW İstasyon, Araç maks 75 kW destekliyor
        console.log(sarjSuresi(20, 80, 60, 100, 75)); // Tahmini ~32 dakika


        /*2.Şarj Süresi ve Fiyat Hesabı*/
        const sarjHesapla = (
            mevcutYuzde,
            hedefYuzde,
            bataryaKapasitesiKwh,
            istasyonKw,
            aracMaksKw,
            kwhFiyati = 9.5,
            sabitUcret = 20,
            verimlilik = 0.90
        ) => {
            // Geçersiz girdi kontrolleri
            if (mevcutYuzde >= hedefYuzde || mevcutYuzde < 0 || hedefYuzde > 100) {
                return { sureDakika: 0, cekilenKwh: 0, toplamTutar: 0 };
            }

            const sarjYuzdesi = hedefYuzde - mevcutYuzde;
            // Bataryaya girmesi gereken net enerji
            const netEnerji = bataryaKapasitesiKwh * (sarjYuzdesi / 100);

            // Kayıplar dahil prizden/şebekeden çekilen brüt enerji
            const brutEnerji = netEnerji / verimlilik;

            // Gerçekleşen şarj hızı
            const gercekSarjGucu = Math.min(istasyonKw, aracMaksKw);
            if (gercekSarjGucu <= 0) return { sureDakika: 0, cekilenKwh: 0, toplamTutar: 0 };

            // Süre hesabı (dakika)
            const sureDakika = Math.round((netEnerji / (gercekSarjGucu * verimlilik)) * 60);

            // Maliyet hesabı: (Çekilen kWh * Birim Fiyat) + Sabit Ücret
            const enerjiTutari = brutEnerji * kwhFiyati;
            const toplamTutar = enerjiTutari + sabitUcret;

            return {
                sureDakika: sureDakika,
                cekilenKwh: Number(brutEnerji.toFixed(2)),
                toplamTutar: Number(toplamTutar.toFixed(2))
            };
        };

        // %20'den %80'e, 60 kWh batarya, 100 kW istasyon, araç maks 75 kW destekliyor
        // kWh Fiyatı: 9.5 TL, Sabit Ücret: 20 TL
        const sonuc2 = sarjHesapla(20, 80, 60, 100, 75, 9.5, 20);

        console.log(sonuc2);
        // Çıktı: { sureDakika: 32, cekilenKwh: 40, toplamTutar: 400 }


        /* 3.Şarj Süresi ,Fiyat,Gece-Gündüz Tarifesi*/
        // Araç Tipleri ve Teknik Özellikleri
        const ARAC_TIPLERI = {
            BEV_800V: {
                ad: "Tam Elektrikli (800V Yüksek Performans)",
                maksAcKw: 22,
                maksDcKw: 270,
                verimlilik: 0.94, // Daha az ısı kaybı
                dcDestegi: true
            },
            BEV_400V: {
                ad: "Tam Elektrikli (Standard 400V)",
                maksAcKw: 11,
                maksDcKw: 120,
                verimlilik: 0.88,
                dcDestegi: true
            },
            PHEV: {
                ad: "Plug-in Hibrit",
                maksAcKw: 3.7,
                maksDcKw: 0, // Genelde DC desteklemez
                verimlilik: 0.85,
                dcDestegi: false
            },
            MINI_L7E: {
                ad: "Mikro Şehir Aracı (Citroën Ami vb.)",
                maksAcKw: 2.3,
                maksDcKw: 0,
                verimlilik: 0.85,
                dcDestegi: false
            }
        };

        const sarjHesaplaAracli = (
            mevcutYuzde,
            hedefYuzde,
            bataryaKapasitesiKwh,
            istasyonKw,
            istasyonTipi = "DC", // "AC" veya "DC"
            aracTipi = ARAC_TIPLERI.BEV_400V,
            baslangicSaati = 20,
            gunduzKwhFiyati = 9.5,
            geceKwhFiyati = 6.0,
            sabitUcret = 20
        ) => {
            if (mevcutYuzde >= hedefYuzde) return { sureDakika: 0, toplamTutar: 0 };

            // 1. Aracın alabileceği maksimum şarj gücünü tespit et
            let aracMaksGuc = 0;
            if (istasyonTipi === "DC") {
                // Araç DC desteklemiyorsa otomatik olarak AC sınırına düşür
                aracMaksGuc = aracTipi.dcDestegi ? aracTipi.maksDcKw : aracTipi.maksAcKw;
            } else {
                aracMaksGuc = aracTipi.maksAcKw;
            }

            // 2. Gerçek gerçekleşen şarj hızı
            const gercekGuc = Math.min(istasyonKw, aracMaksGuc);
            if (gercekGuc <= 0) return { sureDakika: 0, toplamTutar: 0 };

            // 3. Enerji ve Verimlilik Hesabı
            const sarjYuzdesi = hedefYuzde - mevcutYuzde;
            const netEnerji = bataryaKapasitesiKwh * (sarjYuzdesi / 100);
            const brutEnerji = netEnerji / aracTipi.verimlilik;

            // 4. Süre Hesabı (Dakika)
            const sureDakika = Math.round((brutEnerji / gercekGuc) * 60);

            // 5. Gece/Gündüz Maliyet Hesabı
            const toplamSureSaat = brutEnerji / gercekGuc;
            let gunduzSaatleri = 0;
            let geceSaatleri = 0;
            let kalanSure = toplamSureSaat;
            let mevcutSaat = baslangicSaati % 24;

            while (kalanSure > 0) {
                const dilim = Math.min(kalanSure, 1);
                if (mevcutSaat >= 6 && mevcutSaat < 22) {
                    gunduzSaatleri += dilim;
                } else {
                    geceSaatleri += dilim;
                }
                kalanSure -= dilim;
                mevcutSaat = (mevcutSaat + 1) % 24;
            }

            const gunduzKwh = (gunduzSaatleri / toplamSureSaat) * brutEnerji;
            const geceKwh = (geceSaatleri / toplamSureSaat) * brutEnerji;
            const toplamTutar = (gunduzKwh * gunduzKwhFiyati) + (geceKwh * geceKwhFiyati) + sabitUcret;

            return {
                aracModeli: aracTipi.ad,
                kullanilanGucKw: gercekGuc,
                sureDakika: sureDakika,
                cekilenKwh: Number(brutEnerji.toFixed(2)),
                toplamTutar: Number(toplamTutar.toFixed(2))
            };
        };

        // --- TEST / ÖRNEK KULLANIMLAR ---

        // Senaryo A: Plug-in Hibrit aracı 150 kW DC hızlı şarj istasyonuna taksak bile
        // Araç DC desteklemediği için 3.7 kW hızla şarj olur.
        console.log(sarjHesaplaAracli(10, 100, 13.8, 150, "DC", ARAC_TIPLERI.PHEV));
        // Süre ~221 dk (3.5 saat) çıkar.

        // Senaryo B: 800V Taycan / Ioniq 5 gibi bir aracı 300 kW DC istasyona takarsak
        console.log(sarjHesaplaAracli(10, 80, 77, 300, "DC", ARAC_TIPLERI.BEV_800V));
        // Yüksek verimlilik ve 270 kW çekebildiği için Süre ~13 dk çıkar.  */
    </script>
</body>

</html>
