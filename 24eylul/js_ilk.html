        //şarj süresi tahmin edecek dakika cinsinden ,verilecek degerler:mevcutYüzde,hedefYuzde,bataryaKw,istasyonKw

        const sarjSuresi = (
            mevcutYuzde,
            hedefYuzde,
            bataryaKw,
            istasyonKw
        ) => {
            if (mevcutYuzde === hedefYuzde) {
                return 0;
            }

            const sarjYuzdesi = hedefYuzde - mevcutYuzde;
            const gerekliEnerji = bataryaKw * (sarjYuzdesi / 100);
            const gercekSarjGucu = Math.min(istasyonKw, bataryaKw);

            return (gerekliEnerji / gercekSarjGucu) * 60;
        };
        console.log(sarjSuresi(20, 80, 10, 20));
