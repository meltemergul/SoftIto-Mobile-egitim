        const urunleriGetir = async () => {
            try {
                console.log("Harici API'ye bağlanılıyor...");
                const response = await fetch("https://dummyjson.com/products");

                if (!response.ok) {
                    throw new Error(`HTTP hatası: ${response.status}`);
                }

                const data = await response.json();
                const secilenUrunler = data.products
                    .slice(2, 7)
                    .map(p => ({
                        isim: p.title,
                        aciklama: p.description,
                        kategori: p.category,
                        fiyat: p.price,
                        stok: p.stock,
                        etiket: p.tags.join(", ")
                    }));

                console.log("Seçilen ürünler:");
                console.table(secilenUrunler);

            } catch (err) {
                console.warn("API hatası:", err.message);
            }
        };
